name: probe-nopub

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 互通测试需要 sibling 仓 respire-memlite（同 org 同 main）
          repository: risense-ai/respire-memlite
          path: respire-memlite
          # 公开仓匿名可拉；私有仓需配 PAT（secrets.MEMLITE_RS_REPO_TOKEN）
        continue-on-error: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Build Rust memlite (for compat tests)
        id: rsbuild
        continue-on-error: true
        run: |
          cargo build --release --manifest-path respire-memlite/rust/Cargo.toml
          echo "bin=respire-memlite/rust/target/release/memlite" >> "$GITHUB_OUTPUT"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        env:
          MEMLITE_RS_BIN: ${{ steps.rsbuild.outputs.bin }}
        run: pnpm -r test
