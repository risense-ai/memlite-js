name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 互通测试需要 sibling 仓 respire-memlite（同 org 同 main）
          repository: risense-ai/respire-memlite
          path: respire-memlite
          # 公开仓匿名可拉；私有仓需配 PAT（secrets.MEMLITE_RS_REPO_TOKEN）
        continue-on-error: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Build Rust memlite (for compat tests)
        id: rsbuild
        continue-on-error: true
        run: |
          cargo build --release --manifest-path respire-memlite/rust/Cargo.toml
          echo "bin=respire-memlite/rust/target/release/memlite" >> "$GITHUB_OUTPUT"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        env:
          MEMLITE_RS_BIN: ${{ steps.rsbuild.outputs.bin }}
        run: pnpm -r test

  publish:
    # 本地发布为主路径时发布步骤保持跳过；自设 NPM_TOKEN secret 后推 v* tag 即自动发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm -r test

      - name: Publish @rsrsai/memlite
        if: ${{ secrets.NPM_TOKEN != '' }}
        working-directory: packages/core
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish skipped (no NPM_TOKEN)
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: echo "未配置 NPM_TOKEN，跳过 npm 发布（本地发布或后续配 token 后重推 tag）"
